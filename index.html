<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Update</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0067c0 !important; /* ضمان استمرار اللون الأزرق */
      color: #ffffff !important;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: none;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9999;
    }

    /* أنيميشن دائرة النقاط المتحركة */
    .spinner {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 45px;
    }

    .circle {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: rotate(225deg);
      animation: orbit 5.5s infinite;
    }

    .circle::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .circle:nth-child(2) { animation-delay: 240ms; }
    .circle:nth-child(3) { animation-delay: 480ms; }
    .circle:nth-child(4) { animation-delay: 720ms; }
    .circle:nth-child(5) { animation-delay: 960ms; }

    @keyframes orbit {
      0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
      7% { transform: rotate(345deg); animation-timing-function: linear; }
      30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
      39% { transform: rotate(690deg); animation-timing-function: linear; }
      70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
      75% { transform: rotate(945deg); animation-timing-function: ease-out; }
      76% { transform: rotate(945deg); opacity: 0; }
      100% { transform: rotate(945deg); opacity: 0; }
    }

    /* النصوص بوضوح وحجم مناسب لشاشات الـ FHD و 4K */
    .status-text, .sub-text {
      font-size: 2.2vw; /* يتكيف تلقائياً مع عرض الشاشة */
      min-font-size: 20px;
      font-weight: 300;
      line-height: 1.6;
      color: #ffffff;
    }

    .footer-text {
      position: absolute;
      bottom: 12%;
      font-size: 1.8vw;
      font-weight: 300;
      text-align: center;
      width: 100%;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- دائرة التحميل -->
    <div class="spinner">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>

    <!-- النصوص -->
    <div class="status-text">
      Working on updates <span id="percent">0</span>% complete.
    </div>
    <div class="sub-text">
      Don't turn off your PC. This will take a while.
    </div>
  </div>

  <div class="footer-text">
    Your PC may restart several times.
  </div>

  <script>
    var count = 0;
    var percentElement = document.getElementById('percent');

    function updateProgress() {
      if (count < 100) {
        count += Math.floor(Math.random() * 2) + 1;
        if (count > 100) count = 100;
        if (percentElement) {
          percentElement.innerHTML = count;
        }
        setTimeout(updateProgress, 3000);
      }
    }

    setTimeout(updateProgress, 1000);
  </script>

</body>
</html>
